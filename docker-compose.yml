services:
  redis:
    image: redis:7-alpine
    # Published on loopback only. Docker's port publishing bypasses host
    # firewalls such as ufw, so a bare "6379:6379" would put an unauthenticated
    # Redis on every interface of a public host.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      REDIS_ADDR: redis:6379
      # 4 workers x 50ms base latency => capacity ~= 80 ops/s, matching the
      # "Shed your load" post. Latency and the other knobs are live-tunable.
      CONCURRENCY: "4"
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      REDIS_ADDR: redis:6379
      PORT: "8080"
      # Most rooms (isolated per-visitor systems) allowed live at once; a rough
      # figure for one shared vCPU. 0 removes the cap.
      MAX_ROOMS: "20"
    # Loopback only, for the same reason as Redis: http://localhost:8080 works,
    # and a deployed instance is reached through the proxy service below instead.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis
    restart: unless-stopped

  # Optional public entry point. Only starts with:
  #   docker compose --profile public up
  # nginx terminates HTTPS on 80/443 and proxies to the frontend over the Docker
  # network. It gets and renews a Let's Encrypt certificate for SITE_ADDRESS by
  # itself, so that must be a real hostname pointing at this machine, set in a
  # (gitignored) .env file. See DEPLOY.md. The default `docker compose up` does
  # not start it.
  proxy:
    build: ./proxy
    profiles: ["public"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: SITE_ADDRESS
    # The only ports the stack publishes on every interface.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The ACME account key and the certificate. Keep this volume: Let's
      # Encrypt rate-limits how often a hostname can be issued a new one.
      - acme-state:/var/lib/nginx-acme
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  acme-state:
